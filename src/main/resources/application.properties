spring.application.name=AutoEscola3ESR

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autoescola3esr}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

api.security.token.secret=${JWT_SECRET:change-me-in-development}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500}
app.external.viacep.base-url=${VIACEP_BASE_URL:https://viacep.com.br}